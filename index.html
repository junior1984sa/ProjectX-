<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/marca.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Find the companies that hire what you do. WhoHiresYou mostra quais empresas contratam o seu serviço, na sua cidade." />
    <title>WhoHiresYou — Prospecção B2B</title>

    <!-- PWA: manifest e cor de tema -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#080A0D" />

    <!-- PWA no iOS: Safari não lê manifest.json plenamente, exige tags próprias -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WhoHiresYou" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <!-- SDK do Mercado Pago: usado para tokenizar o cartão no navegador,
         sem que o número do cartão passe pelo nosso backend. -->
    <script src="https://sdk.mercadopago.com/js/v2"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Registra o service worker para tornar o app instalável e
      // permitir funcionamento offline básico (cache de estáticos).
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch((erro) => {
            console.error("Erro ao registrar service worker:", erro)
          })
        })
      }
    </script>
  </body>
</html>
