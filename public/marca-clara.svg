<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="WhoHiresYou">
  <!--
    MARCA — WhoHiresYou — fundo claro

    Um W com uma cunha dourada descendo ate o vertice central. O W e a
    inicial; a cunha e um foco apontando para o ponto onde os dois
    tracos se encontram — que e o que o produto faz: mostrar, no meio
    do mercado, a empresa que contrata o seu servico.

    TRACO GROSSO COM PONTA ARREDONDADA, e nao traco fino que afina ate
    o bico. Ponta fina e a primeira coisa que o navegador come ao
    reduzir para 16 pixels no favicon, e e justamente onde estaria o
    detalhe que faz a marca ser reconhecivel.

    POR QUE EXISTEM DUAS VARIANTES: dentro de <img> o SVG e um
    documento isolado, sem contexto de CSS — `currentColor` cairia para
    preto sobre fundo preto. Entao a cor e explicita, e cada fundo tem
    o seu arquivo. O ouro e o mesmo nos dois: e a cor da marca, e e
    legivel em ambos.
  -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M50 14 L50 44" stroke="#D4A84F" stroke-width="13"/>
    <path d="M14 26 L33 78 L50 44 L67 78 L86 26"
          stroke="#11151B" stroke-width="12"/>
  </g>
</svg>
